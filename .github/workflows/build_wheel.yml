name: CI_wheel_datawarrior_clustersort

# name:    build_wheel.yml
# purpose: build a .whl as an artifact without a secret/GitHub token

on:
  workflow_dispatch:  # launch only by the manual trigger
    branches:
      - dev
      - main

# prevent concurrency of workflows (rule GH102):
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_source:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_PREFERENCE: only-managed  # use uv managed Python interpreter

    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup uv and latest Python 3
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3"
          enable-cache: true

      - name: build .whl and .tar.gz
        run: uv build

      - name: package archive `datawarrior_clustersort_wheel.zip`
        uses: actions/upload-artifact@v7
        with:
          name: datawarrior_clustersort_wheel
          path: |
            dist/*.whl
            dist/*.tar.gz
